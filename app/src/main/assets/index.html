<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#102047;background:#eef3f9}header{height:62px;background:#102047;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 15px}header small{display:block;color:#9dcaff}.score{font-weight:800}.app{display:grid;grid-template-columns:1fr 355px;height:calc(100vh - 62px)}#map{height:100%}.panel{background:#fff;padding:15px;overflow:auto}.row{display:flex;gap:7px}.btn,.choice{border:0;border-radius:11px;padding:11px;font-weight:800}.btn{flex:1;background:#135fdd;color:#fff}.choice{width:100%;background:#fff;border:1px solid #dbe3ef;text-align:left;margin:5px 0}.card{background:#f3f7fc;border-radius:15px;padding:14px;margin:12px 0;font-size:17px;font-weight:650}.hint{color:#687792;font-size:13px}.trust{height:9px;background:#dce4ef;border-radius:9px;overflow:hidden}.trust i{display:block;height:100%;background:#20c47a}@media(max-width:760px){.app{display:block}.panel{position:absolute;z-index:999;left:9px;right:9px;bottom:9px;border-radius:17px;max-height:47vh;box-shadow:0 8px 30px #10204766}header small{display:none}}</style></head><body><header><div><b>MISSÃO PORTA A PORTA</b><small>Mapa real · MEO + MEO Energia</small></div><div class="score"><span id="xp">0 XP</span> · <span id="sales">0 vendas</span></div></header><main class="app"><div id="map"></div><aside class="panel"><div class="row"><button class="btn" onclick="locate()">📍 Minha zona</button><button class="btn" onclick="buildings()">🏠 Ver casas</button></div><div id="content"><h2>Escolhe uma casa real</h2><p class="hint">Localiza-te, carrega as casas do OpenStreetMap e toca num edifício para bater à porta.</p></div></aside></main><script>
const map=L.map('map').setView([41.1579,-8.6291],17);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap contributors'}).addTo(map);let group=L.geoJSON().addTo(map),sel,xp=+(localStorage.xp||0),sales=+(localStorage.sales||0),trust=52,visited=JSON.parse(localStorage.visited||'[]');function score(){xpEl.textContent=xp+' XP';salesEl.textContent=sales+' vendas';localStorage.xp=xp;localStorage.sales=sales}const xpEl=document.querySelector('#xp'),salesEl=document.querySelector('#sales');score();
function locate(){map.locate({setView:true,maxZoom:18,enableHighAccuracy:true});map.once('locationfound',e=>{L.circleMarker(e.latlng,{radius:9,color:'#fff',weight:3,fillColor:'#135fdd',fillOpacity:1}).addTo(map);setTimeout(buildings,400)});map.once('locationerror',()=>alert('Ativa a localização.'))}
async function buildings(){let b=map.getBounds(),q=`[out:json][timeout:20];way[building](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()});out geom;`;content.innerHTML='<h2>A procurar casas…</h2>';try{let d=await(await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:q})).json(),fs=d.elements.filter(e=>e.geometry).map(e=>({type:'Feature',properties:{id:String(e.id)},geometry:{type:'Polygon',coordinates:[e.geometry.map(p=>[p.lon,p.lat])]}}));group.clearLayers();group=L.geoJSON(fs,{style:f=>({color:visited.includes(f.properties.id)?'#758399':'#135fdd',fillColor:visited.includes(f.properties.id)?'#9ba6b5':'#ffd43b',fillOpacity:.7,weight:2}),onEachFeature:(f,l)=>l.on('click',()=>choose(f,l))}).addTo(map);content.innerHTML=`<h2>${fs.length} casas encontradas</h2><p class=hint>Toca num edifício amarelo para iniciar a abordagem.</p>`}catch(e){content.innerHTML='<h2>Servidor ocupado</h2><p class=hint>Tenta novamente dentro de alguns segundos.</p>'}}
function choose(f,l){let c=l.getBounds().getCenter();sel={id:f.properties.id,lat:c.lat,lng:c.lng};if(!visited.includes(sel.id)){visited.push(sel.id);localStorage.visited=JSON.stringify(visited)}l.setStyle({fillColor:'#9ba6b5'});scene(0)}
const ss=[['Estou bem como estou e não quero mudar.',['Compreendo. Quanto paga atualmente?','A MEO é melhor. Quer aderir?','Volto noutra altura.']],['Pago quase 74 €, mas tenho isto há muitos anos.',['Se mantiver tudo e poupar, quer comparar?','Tem mesmo de mudar.','E na eletricidade, quanto paga?']],['Quero futebol e telefone fixo.',['Confirmo cobertura e faço proposta equivalente.','Assine já aqui.','Primeiro confirmo fibra nesta morada.']],['Mudar de fornecedor de energia dá trabalho?',['Não há interrupção e tratamos de tudo.','É só assinar.','Analisamos MEO e Energia em conjunto.']]];
function scene(n){let s=ss[Math.min(n,3)];content.innerHTML=`<h2>Sr. Joaquim</h2><p class=hint>Confiança ${trust}%</p><div class=trust><i style="width:${trust}%"></i></div><div class=card>“${s[0]}”</div><b>O que respondes?</b>`;s[1].forEach((a,i)=>{let x=document.createElement('button');x.className='choice';x.textContent=String.fromCharCode(65+i)+' — '+a;x.onclick=()=>answer(n,i);content.appendChild(x)});let v=document.createElement('button');v.className='btn';v.style.width='100%';v.style.marginTop='8px';v.textContent='👁 Abrir Google Street View';v.onclick=()=>Android.street(sel.lat,sel.lng);content.appendChild(v)}
function answer(n,i){if(i==0){xp+=150;trust=Math.min(100,trust+16);if(n>=3)return close();scene(n+1)}else if(i==1){xp=Math.max(0,xp-30);trust=Math.max(0,trust-15);scene(n)}else{xp+=60;trust=Math.min(100,trust+6);scene(n==1?3:n)}score()}function close(){sales++;xp+=300;score();content.innerHTML='<h2>✅ Venda fechada!</h2><div class=card>Boa abordagem consultiva. Encontraste a necessidade antes de apresentar a solução.</div><p class=hint>Seleciona outra casa para continuar.</p>'}
</script></body></html>
